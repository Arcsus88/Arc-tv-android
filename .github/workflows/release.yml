name: Release

# Every push to main becomes a release that installed devices pick up by
# themselves (see RELEASING.md). Docs-only pushes don't.
#
# Until the SIGNING_PASSWORD and UPDATE_TOKEN secrets are added, it publishes a
# preview instead: a prerelease tagged "preview", replaced on each push, signed
# with a throwaway key and without the update token. Good for a look; it never
# updates itself and the updater ignores it.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Test, build APKs, publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release or preview
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          if [ -n "$SIGNING_PASSWORD" ] && [ -n "$UPDATE_TOKEN" ]; then
            echo "MODE=release" >> "$GITHUB_ENV"
            echo "VERSION_NAME=1.2.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          elif [ -z "$SIGNING_PASSWORD" ] && [ -z "$UPDATE_TOKEN" ]; then
            echo "::notice::No SIGNING_PASSWORD or UPDATE_TOKEN secret yet, so this publishes a preview (RELEASING.md)."
            echo "MODE=preview" >> "$GITHUB_ENV"
            echo "VERSION_NAME=1.2.$GITHUB_RUN_NUMBER-preview" >> "$GITHUB_ENV"
          else
            echo "::error::Add both SIGNING_PASSWORD and UPDATE_TOKEN (RELEASING.md): a release with only one could never update itself."
            exit 1
          fi
          # versionCode only ever grows, so each release installs over the last.
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Decrypt signing key
        if: env.MODE == 'release'
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: >
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000
          -in signing/release.keystore.enc -out release.keystore -pass env:SIGNING_PASSWORD

      - name: Build signed release APKs
        if: env.MODE == 'release'
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          KEY_ALIAS: arcdisney
          KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: >
          ./gradlew :app:assembleRelease --stacktrace
          -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Build preview APKs
        if: env.MODE == 'preview'
        # No signing key: the build falls back to this runner's throwaway debug key.
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: >
          ./gradlew :app:assembleRelease --stacktrace
          -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Name the APKs
        run: |
          mkdir -p dist
          name=$([ "$MODE" = release ] && echo "$VERSION_NAME" || echo preview)
          for abi in arm64-v8a armeabi-v7a universal; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/arc-disney-$name-$abi.apk"
          done
          rm -f release.keystore

      - name: Publish release
        if: env.MODE == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Arc Disney ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          body: |
            ${{ github.event.head_commit.message }}

            Devices running Arc Disney install this by themselves within the hour.
            For a new device, `arc-disney-${{ env.VERSION_NAME }}-universal.apk` installs on any ARM device.
          files: dist/*.apk

      - name: Clear the previous preview
        if: env.MODE == 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete preview --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true

      - name: Publish preview
        if: env.MODE == 'preview'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          name: Arc Disney preview (${{ env.VERSION_NAME }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            A preview to look at, built from ${{ github.sha }}.

            Signed with a throwaway key and without the update token, so it never
            updates itself and can't be updated into a real release: uninstall it
            before installing a real one. Real releases start once the
            SIGNING_PASSWORD and UPDATE_TOKEN secrets are added (RELEASING.md).

            `arc-disney-preview-universal.apk` installs on any ARM Android 8.0+ device.
          files: dist/*.apk
