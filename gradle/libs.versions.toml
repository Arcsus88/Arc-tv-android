[versions]
agp = "8.11.1"
kotlin = "2.2.10"
coreKtx = "1.15.0"
splashscreen = "1.0.1"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
datastore = "1.1.1"
okhttp = "4.12.0"
kotlinxSerialization = "1.9.0"
coroutines = "1.10.2"
coil = "2.7.0"
libvlc = "3.7.7"
libtorrent4j = "2.1.0-39"
roborazzi = "1.32.2"
